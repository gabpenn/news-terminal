<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700&display=swap">
<style>
:root{--bg:#000;--panel:#0d0d0d;--line:#2a2a2a;--text:#ececec;--dim:#8a8a8a;--amber:#ffa028;--blue:#4da3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.3 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--amber);color:#000;font-weight:700;letter-spacing:.5px}
header span:last-child{font-weight:500}
.bar{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:grid;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
button,input{font:inherit}
button{flex:none;color:var(--dim);background:transparent;border:1px solid var(--line);padding:6px 12px;cursor:pointer;min-height:36px}
button.on{color:#000;background:var(--amber);border-color:var(--amber);font-weight:700}
input{width:100%;color:var(--text);background:#000;border:1px solid var(--line);padding:8px 10px;min-height:38px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.row{display:grid;grid-template-columns:64px 1fr;gap:2px 10px;padding:8px 12px;border-bottom:1px solid #161616;color:inherit;text-decoration:none}
.row:hover{background:#111}
.row.new{animation:fl 1.8s ease-out}
@keyframes fl{from{background:#3a2600}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.row.new{animation:none}}
.t{color:var(--dim);grid-row:span 2}
.h{font-weight:500}
.s{color:var(--blue);font-size:15px}
.s i{color:var(--dim);font-style:normal;margin-left:8px}
.msg{padding:24px 12px;color:var(--dim)}
@media (min-width:760px){
 .row{grid-template-columns:84px 130px 1fr 90px;align-items:baseline}
 .t{grid-row:auto}.s{font-size:inherit}.s i{display:none}
 .h{grid-column:3}.row .tp{display:block;color:var(--dim);text-align:right}
 .bar{grid-template-columns:auto auto 1fr;align-items:center}
}
.tp{display:none}
</style>
</head>
<body>
<header><span>NEWS TERMINAL</span><span id="status">Loading…</span></header>
<div class="bar">
  <div class="chips" id="regions"></div>
  <div class="chips" id="topics"></div>
  <input id="q" type="search" placeholder="Search headlines" aria-label="Search headlines">
</div>
<div id="feed"></div>
<script>
var REGIONS=[["GLOBAL","Global"],["AR","Argentina"]];
var TOPICS=["Economy","Politics","World","Tech","Energy","Sports"];
var st={regions:{GLOBAL:true,AR:true},topics:{}};
TOPICS.forEach(function(t){st.topics[t]=true});
try{var sv=JSON.parse(localStorage.getItem("nt-prefs")||"null");if(sv&&sv.regions&&sv.topics)st=sv}catch(e){}
function save(){try{localStorage.setItem("nt-prefs",JSON.stringify(st))}catch(e){}}
var items=[],seen=null,query="";
function chips(id,list,key){
  var c=document.getElementById(id);c.innerHTML="";
  list.forEach(function(x){
    var b=document.createElement("button");b.textContent=x[1];b.className=st[key][x[0]]?"on":"";
    b.onclick=function(){st[key][x[0]]=!st[key][x[0]];save();chips(id,list,key);render()};
    c.appendChild(b)})
}
function fmt(t){
  var d=new Date(t),n=new Date();
  var hm=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false});
  return d.toDateString()===n.toDateString()?hm:d.toLocaleDateString([],{day:"2-digit",month:"short"})+" "+hm
}
function render(){
  var f=document.getElementById("feed");f.innerHTML="";
  var q=query.toLowerCase();
  var list=items.filter(function(i){return st.regions[i.region]&&st.topics[i.topic]&&(!q||i.title.toLowerCase().indexOf(q)>-1)}).slice(0,120);
  if(!list.length){f.innerHTML='<div class="msg">No headlines match these filters.</div>';return}
  list.forEach(function(i){
    var a=document.createElement("a");a.className="row"+(i.fresh?" new":"");a.href=i.link;a.target="_blank";a.rel="noopener noreferrer";
    var t=document.createElement("span");t.className="t";t.textContent=fmt(i.t);
    var s=document.createElement("span");s.className="s";s.textContent=i.source;
    var m=document.createElement("i");m.textContent=i.topic;s.appendChild(m);
    var h=document.createElement("span");h.className="h";h.textContent=i.title;
    var p=document.createElement("span");p.className="tp";p.textContent=i.topic;
    a.appendChild(t);a.appendChild(s);a.appendChild(h);a.appendChild(p);f.appendChild(a)})
}
function load(){
  fetch("/api/news").then(function(r){return r.json()}).then(function(d){
    var first=seen===null;if(first)seen={};
    d.items.forEach(function(i){i.fresh=!first&&!seen[i.link];seen[i.link]=1});
    items=d.items;
    document.getElementById("status").textContent="Updated "+new Date(d.updated).toLocaleTimeString([],{hour12:false});
    render()
  }).catch(function(){document.getElementById("status").textContent="Connection problem"})
}
document.getElementById("q").oninput=function(){query=this.value;render()};
chips("regions",REGIONS,"regions");chips("topics",TOPICS.map(function(t){return[t,t]}),"topics");
load();setInterval(load,45000);
</script>
</body>
</html>
